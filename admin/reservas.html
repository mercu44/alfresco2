<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas · Alfresco</title>
    <link rel="stylesheet" href="./css/reservas.css">

    <!-- Iconos -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main>

        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->
        <aside class="sidebar">

            <div class="header">
                <h1>Reservas</h1>
            </div>

            <div class="fila">

                <a class="en-proceso" >Gestion Reservas</a>
                <a class="no-implementado">Reservas por día</a>
                <a class="en-proceso" href="./clientes.html">Clientes</a>
                <a class="no-implementado">Configuracion de mesas</a>
                <a class="no-implementado">Estadísticas</a>
                <a class="no-implementado">Nueva Reserva</a>

            </div>
            <button id="cerrarSesion">Salir</button>


        </aside>

        <!-- ========================= -->
        <!-- CONTENIDO -->
        <!-- ========================= -->
         <div class="contenedor">
        <section class="info-reserva">

            <div class="header">
                <h2>Reservas actuales</h2>
                <form id="estadoForm">
                    <select id="estadoSelect">
                        <option value ="pendiente" selected>Pendiente</option>
                        <option value ="hecha">Hecha</option>
                        <option value ="confirmada">Confirmada</option>
                        <option value ="cancelada">Cancelada</option>
                        <option value ="no-show">No-show</option>
                        <option value ="pasada">Pasada</option>
                    </select>

                    
                </form>
                <form id="filtroForm">
                    <select id="filtroSelect">
                        <option value="ohr" selected>Orden hecha: mas recientes</option>
                        <option value="oha">Orden hecha: mas antiguas</option>

                        <option value="orr">Orden reserva: mas recientes</option>
                        <option value="ora">Orden reserva: mas antiguas</option>

                    </select>
                </form>
                <div class="badge" id="numReservas">
                    12 reservas
                </div>
            </div>

            <section class="lista" id="listaReservas">

                <!-- RESERVA -->
                <div class="item-wrapper">
                    <article class="item">

                        <div class="estado pendiente"></div>

                        <div class="item-contenido">

                            <div class="item-cliente">

                                <h3>Alberto Blasco</h3>

                                <span>+34 646736013</span>

                                <span>albertoblascoo@gmail.com</span>

                            </div>

                            <div class="item-info">

                                <span>
                                    <i class="fa-solid fa-users"></i>
                                    2 personas
                                </span>

                                <span>
                                    <i class="fa-solid fa-calendar"></i>
                                    15/08/2026
                                </span>

                                <span>
                                    <i class="fa-solid fa-clock"></i>
                                    16:00
                                </span>

                                <span class="badge">
                                    WEB
                                </span>

                            </div>

                        </div>

                    </article>
                    <div class="submenu">
                        <button class="btnSubmenu greyBack">Cliente info</button>
                        <button class="btnSubmenu orangeBack">Editar Reserva</button>
                        <button class="btnSubmenu greenBack">Aceptar</button>
                        <button class="btnSubmenu redBack">Rechazar</button>
                        <button class="btnSubmenu blueBack">Archivar</button>
                        
                    </div>
                </div>

               

            </section>

        </section>
        <section class="panel columna" id="panel" >
            <h2>Editar Reserva</h2>
            <div class="editarContenedor" >
                <form class="formEditar">
                    <div class="editarItem">
                        <label>id</label>
                        <p id="editarIdReserva"></p>
                    </div>
                    <div class="editarItem">
                        <label>Cliente Id</label>
                        <input type="text" id="editarIdClienteReserva"></input>
                    </div>
                    <div class="editarItem">
                        <label>Nombre Cliente</label>
                        <p id="editarNombreClienteReserva"></p>
                    </div>
                    <div class="editarItem">
                        <label>Mesa</label>
                        <input type="text" id="editarMesaReserva">
                    </div>
                    <div class="editarItem">
                        <label>Fecha</label>
                        <input type="date" id="editarFechaReserva">   
                    </div>
                    <div class="editarItem">
                        <label>hora inicio</label>
                        <input type="text" id="editarHoraInicioReserva">
                    </div>
                    <div class="editarItem">
                        <label>hora fin</label>
                        <input type="text" id="editarHoraFinReserva">  
                    </div>
                    <div class="editarItem">
                        <label>Fecha Creacion</label>
                        <p id="fechaCreacionReserva"></p>
                        
                    </div>
                    <div class="editarItem">
                        <label>Estado</label>
                            <select >
                                <option value="pendiente">pendiente</option>
                                <option value="denegada">denegada</option>
                                <option value="lista-espera">lista espera</option>
                                <option value="hecha">hecha</option>
                                <option value="confirmada">confirmada</option>
                                <option value="cancelada">cancelada</option>
                                <option value="no-show">no-show</option>
                                <option value="pasada">pasada</option>
                                <option value="eliminada">eliminada</option>
                            </select>
                        
                    </div>
                    <div class="editarItem">
                        <label>token</label>
                        <p id="tokenReserva"></p>
                    </div>
                    <div class="editarItem">
                       <label>tipo Reserva</label>
                        <select>
                            <option value="web">web</option>
                            <option value="whatsapp">whatsapp</option>
                            <option value="llamada">llamada</option>
                        </select>
                    </div>
                    <div class="editarItem">
                            <label>Personas</label>
                        <input type="text">
                    </div>
 
                    <button>Editar</button>
                </form>
            </div>


        </section>
        </div>

    </main>
    <script src="./js/reservas.js"></script>
</body>

</html>
