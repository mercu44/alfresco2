<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas · Alfresco</title>
    <link rel="stylesheet" href="./css/reservas.css">

    <!-- Iconos -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main>

        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->
        <aside class="sidebar">

            <div class="header">
                <h1>Reservas</h1>
            </div>

            <div class="fila">

                <a href="./reservas.html">Gestion Reservas</a>
                <a>Reservas por día</a>
                <a>Clientes</a>
                <a>Configuracion de mesas</a>
                <a>Estadísticas</a>
                <a>Nueva Reserva</a>

            </div>
            <button id="cerrarSesion">Salir</button>


        </aside>

        <!-- ========================= -->
        <!-- CONTENIDO -->
        <!-- ========================= -->
         <div class="contenedor">
        <section class="info-reserva">

            <div class="header">
                <h2>Clientes</h2>
                <form>
                    <input type="search" placeholder="Buscar Cliente...">
                </form>
                <div class="badge" id="numReservas">
                    12 clientes
                </div>
            </div>

            <section class="lista" id="listaReservas">

                <!-- RESERVA -->

                <article class="item">


                    <div class="item-contenido">

                        <div class="item-cliente">

                            <h3>Alberto Blasco</h3>

                            <span>+34 646736013</span>

                            <span>albertoblascoo@gmail.com</span>

                        </div>

                        <div class="item-info">

                            <span>
                                <i class="fa-solid fa-flag"></i>
                                Español
                            </span>

                            <span>
                                <i class="fa-solid fa-calendar"></i>
                                15/08/2026
                            </span>

                            <span>
                                <i class="fa-solid fa-clock"></i>
                                16:00
                            </span>

                            <span class="badge">
                                5
                            </span>

                        </div>

                    </div>

                </article>

               

            </section>

        </section>
        <section class="panel columna" id="panel">
                <h2>Editar Cliente</h2>
            <div class="editarContenedor" >
                <form class="formEditar">
                    <div class="editarItem">
                        <label>id</label>
                        <input type="text" id="idReserva" readonly>
                    </div>
                    <div class="editarItem">
                        <label>Cliente Id</label>
                        <input type="text" id="editarIdClienteReserva"></input>
                    </div>
                    <div class="editarItem">
                        <label>Nombre Cliente</label>
                        <input type="text" id="editarNombreClienteReserva" readonly>
                    </div>
                    <div class="editarItem">
                        <label>Mesa</label>
                        <input type="text" id="editarMesaReserva">
                    </div>
                    <div class="editarItem">
                        <label>Fecha</label>
                        <input type="date" id="editarFechaReserva">   
                    </div>
                    <div class="editarItem">
                        <label>hora inicio</label>
                        <input type="text" id="editarHoraInicioReserva">
                    </div>
                    <div class="editarItem">
                        <label>hora fin</label>
                        <input type="text" id="editarHoraFinReserva">  
                    </div>
                    <div class="editarItem">
                        <label>Fecha Creacion</label>
                        <input type="text" id="fechaCreacionReserva" readonly>
                    </div>
                    <div class="editarItem">
                        <label>Estado</label>
                        <select id="editarEstadoReservaSelect">
                            <option value="pendiente">pendiente</option>
                            <option value="denegada">denegada</option>
                            <option value="lista-espera">lista espera</option>
                            <option value="hecha">hecha</option>
                            <option value="confirmada">confirmada</option>
                            <option value="cancelada">cancelada</option>
                            <option value="no-show">no-show</option>
                            <option value="pasada">pasada</option>
                            <option value="eliminada">eliminada</option>
                        </select>
                        
                    </div>
                    <div class="editarItem">
                        <label>token</label>
                        <input type="text" id="tokenReserva" readonly>
                        
                    </div>
                    <div class="editarItem">
                       <label>tipo Reserva</label>
                        <select id="editarTipoReservaSelect">
                            <option value="web">web</option>
                            <option value="whatsapp">whatsapp</option>
                            <option value="llamada">llamada</option>
                        </select>
                    </div>
                    <div class="editarItem">
                            <label>Personas</label>
                            <input type="text" id="editarPersonasReserva">
                    </div>
 
                    <button>Editar</button>
                </form>
            </div>


        </section>
        </div>

    </main>
    <script src="./js/clientes.js"></script>
</body>

</html>
