<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas · Alfresco</title>
    <link rel="stylesheet" href="./css/reservas.css">

    <!-- Iconos -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main>

        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->
        <aside class="sidebar">

            <div class="header">
                <h1>Reservas</h1>
            </div>

            <div class="fila">

                <a href="./reservas.html">Gestion Reservas</a>
                <a href="./reservasdia.html">Reservas por día</a>
                <a class="actual">Clientes</a>
                <a>Configuracion de mesas</a>
                <a>Estadísticas</a>
                <a>Nueva Reserva</a>

            </div>
            <button id="cerrarSesion">Salir</button>


        </aside>

        <!-- ========================= -->
        <!-- CONTENIDO -->
        <!-- ========================= -->
         <div class="contenedor">
        <section class="info-reserva">

            <div class="header">
                <h2>Clientes</h2>
                <form>
                    <input type="search" placeholder="Buscar Cliente...">
                </form>
                <div class="badge" id="numReservas">
                    12 clientes
                </div>
            </div>

            <section class="lista" id="listaReservas">

                <!-- RESERVA -->

                <article class="item">


                    <div class="item-contenido">

                        <div class="item-cliente">

                            <h3>Alberto Blasco</h3>

                            <span>+34 646736013</span>

                            <span>albertoblascoo@gmail.com</span>

                        </div>

                        <div class="item-info">

                            <span>
                                <i class="fa-solid fa-flag"></i>
                                Español
                            </span>

                            <span>
                                <i class="fa-solid fa-calendar"></i>
                                15/08/2026
                            </span>

                            <span>
                                <i class="fa-solid fa-clock"></i>
                                16:00
                            </span>

                            <span class="badge">
                                5
                            </span>

                        </div>

                    </div>

                </article>

               

            </section>

        </section>
        <section class="panel columna" id="panel">
                <h2>Editar Cliente</h2>
                
            <div class="editarContenedor" >
                <form class="formEditar">
                    <div class="editarItem">
                        <label>id</label>
                        <input type="text" id="idCliente" readonly>
                    </div>
                    <div class="editarItem">
                        <label>Correo</label>
                        <input type="text" id="editarCorreoCliente">   
                    </div>
                    <div class="editarItem">
                        <label>telefono</label>
                        <input type="text" id="editarTelefonoCliente">
                    </div>
                    <div class="editarItem">
                        <label>Nombre Cliente</label>
                        <input type="text" id="editarNombreClienteCliente" readonly>
                    </div>
                    <div class="editarItem">
                        <label>Nacionalidad</label>
                        <input type="text" id="editarNacionalidadCliente">
                    </div>
                    <div class="editarItem">
                        <label>Puntuacion</label>
                        <input type="text" id="editarPuntuacionCliente">  
                    </div>
                    <div class="editarItem">
                        <label>Comentarios Mios</label>
                        <input type="text" id="editarComentariosMiosCliente" readonly>
                    </div>
                    <div class="editarItem">
                        <label>Numero Cancelaciones</label>
                        <input type="text" id="numeroCancelacionesCliente">
                    </div>
                    <div class="editarItem">
                        <label>Numero no-presentados</label>
                        <input type="text" id="numeroNoPresentadosCliente">
                    </div>
                    <div class="editarItem">
                        <label>Numero reservas</label>
                        <input type="text" id="numeroReservasCliente">
                    </div>
                    <div class="editarItem">
                        <label>Última visita</label>
                        <input type="text" id="ultimaVisitaCliente">
                    </div>
 
                    <button>Editar</button>
                </form>
            </div>


        </section>
        </div>

    </main>
    <script src="./js/clientes.js"></script>
</body>

</html>
